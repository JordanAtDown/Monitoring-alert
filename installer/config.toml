# =============================================================
#  MonitoringAlert — configuration
#
#  Modèle installé avec le programme : une configuration existante n'est jamais écrasée.
#  Toutes les clés sont facultatives (les lignes commentées montrent le défaut).
#  Après modification : monitoring-alert.exe restart
# =============================================================

# Chemin complet de la base de données de températures
# Défaut : temperatures.db à côté de ce fichier
# Exemple : "D:\\Backup\\MonitoringAlert\\temperatures.db"
# db_path = "C:\\Users\\<vous>\\AppData\\Local\\Programs\\MonitoringAlert\\temperatures.db"

# Dossier des fichiers de log (défaut : même répertoire que db_path)
# Les fichiers sont nommés monitoring-alert.YYYY-MM-DD.log (rotation quotidienne)
# Exemple : "D:\\Logs\\MonitoringAlert"
# log_dir = "C:\\Users\\Jordan\\AppData\\Local\\Programs\\MonitoringAlert"

# Intervalle de collecte (en secondes, minimum 60)
# Défaut : 300 (toutes les 5 minutes)
collect_interval_secs = 300

# Durée de conservation des mesures brutes (en jours, minimum 7)
# Au-delà, les mesures brutes sont supprimées automatiquement (au démarrage puis
# toutes les 24h) APRÈS avoir été agrégées par jour (médiane, min, max, p95).
# Ces agrégats quotidiens sont conservés sans limite : ce sont eux qui servent
# à suivre la dérive sur toute la durée de la collecte.
# Défaut : 90
raw_retention_days = 90

# Adresse IP du serveur HTTP de LibreHardwareMonitor (Options → Remote Web Server)
# Défaut : "127.0.0.1" (machine locale)
lhm_host = "127.0.0.1"

# Port du serveur HTTP de LibreHardwareMonitor
# Défaut : 8085
lhm_port = 8085

# Adresse d'écoute du tableau de bord web (suivi de la dérive des températures)
# Défaut : "127.0.0.1" (cette machine uniquement). Mettre "0.0.0.0" pour l'ouvrir
# au réseau local : il n'y a AUCUNE authentification, à ne faire que sur un réseau de confiance.
web_host = "127.0.0.1"

# Port du tableau de bord : http://127.0.0.1:8787/
# Défaut : 8787
web_port = 8787

# Niveau de log : "error" | "warn" | "info" (défaut) | "debug" | "trace"
# Passer à "debug" pour diagnostiquer un problème (collecte, capteurs, etc.)
log_level = "info"
