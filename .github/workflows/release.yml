name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Format & Lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"

      - name: Check formatting
        working-directory: backend
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: backend
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build Release
    runs-on: windows-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"

      # The dashboard is embedded in the executable: build it first.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dashboard dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the dashboard
        working-directory: frontend
        run: npm run build

      - name: Build (release)
        working-directory: backend
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-windows-x64
          path: backend/target/x86_64-pc-windows-msvc/release/monitoring.exe
          retention-days: 1
          if-no-files-found: error

  test:
    name: Tests
    runs-on: windows-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"

      - name: Run tests
        working-directory: backend
        run: cargo test --target x86_64-pc-windows-msvc

  installer:
    name: Build the installer
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download the executable
        uses: actions/download-artifact@v4
        with:
          name: monitoring-windows-x64
          path: artifact/

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile the installer
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DExePath=..\artifact\monitoring.exe" installer\monitoring.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-setup
          path: dist/monitoring_*.exe
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, test, installer]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: monitoring-windows-x64
          path: artifact/

      - name: Download the installer
        uses: actions/download-artifact@v4
        with:
          name: monitoring-setup
          path: installer-out/

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
                  | sed '/^[[:space:]]*$/d' | head -c 65000)
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}
        run: |
          echo "$RELEASE_NOTES" > release_notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Monitoring $GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            installer-out/monitoring_*.exe
